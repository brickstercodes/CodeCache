services:
  - type: web
    name: snippet-library-backend
    env: node
    rootDirectory: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: UPLOAD_PASSWORD
        sync: false
      - key: PORT
        value: 10000
